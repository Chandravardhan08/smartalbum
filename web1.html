<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Output Example</title>
</head>
<body>
  <h1>Enter Details</h1>
  
  <form id="myForm">
    <label>Username:</label>
    <input type="text" id="username"><br><br>
    
    <label>Password:</label>
    <input type="password" id="password"><br><br>
    
    <button type="button" onclick="submitForm()">Submit</button>
  </form>

  <script>
    let currentUser = "";
    let peerConnection;
    let dataChannel;
    let teamMembers = [
      { name: "User 1", progress: 0, work: "", reviewed: false },
      { name: "User 2", progress: 0, work: "", reviewed: false }
    ];
    let teamLeader = "Team Leader";

    function submitForm() {
      currentUser = document.getElementById("username").value.trim();
      showDashboard();
    }

    function showDashboard() {
      document.open();
      document.write("<h1>Welcome, " + escapeHtml(currentUser || "User") + "</h1>");
      document.write("<button onclick='profile()'>Profile</button><br><br>");
      document.write("<button onclick='status()'>Status</button><br><br>");
      document.write("<button onclick='chat()'>Chat</button>");
      document.close();
    }

    function profile() {
      document.open();
      document.write("<h2>Profile</h2>");
      document.write("<p>Username: " + escapeHtml(currentUser || "Not set") + "</p>");
      document.write("<button onclick='showDashboard()'>Back</button>");
      document.close();
    }

    function status() {
      document.open();
      document.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>Team Project Status</title>
          <style>
            body { font-family: Arial, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 20px; }
            input { box-sizing: border-box; padding: 8px; margin: 4px 4px 4px 0; }
            button { cursor: pointer; padding: 8px 12px; margin: 4px 4px 12px 0; }
            .member { border: 1px solid #ccc; padding: 12px; margin: 10px 0; }
            .member progress { width: 100%; height: 20px; }
            .summary { font-weight: bold; }
            .reviewed { color: green; font-weight: bold; }
            .member textarea { box-sizing: border-box; width: 100%; min-height: 70px; margin-top: 8px; padding: 8px; }
          </style>
        </head>
        <body>
          <h1>Team Project Status</h1>
          <p><strong>Team leader:</strong> ${escapeHtml(teamLeader)}</p>
          <p class="summary" id="projectSummary"></p>
          <div id="teamList"></div>
          <h2>Team leader</h2>
          <input id="teamLeaderName" value="${escapeHtml(teamLeader)}" placeholder="Leader name">
          <button onclick="updateTeamLeader()">Save Leader</button>
          <h2>Add team member</h2>
          <input id="newMemberName" placeholder="User 3">
          <button onclick="addTeamMember()">Add User</button>
          <br>
          <button onclick="showDashboard()">Back</button>
        </body>
        </html>
      `);
      document.close();
      setTimeout(renderTeamStatus, 0);
    }

    function renderTeamStatus() {
      const list = document.getElementById("teamList");
      const summary = document.getElementById("projectSummary");
      if (!list || !summary) return;

      const totalProgress = teamMembers.reduce((total, member) => total + member.progress, 0);
      const projectProgress = teamMembers.length ? Math.round(totalProgress / teamMembers.length) : 0;
      summary.textContent = "Overall project completion: " + projectProgress + "%";
      list.innerHTML = teamMembers.map((member, index) => `
        <div class="member">
          <strong>${escapeHtml(member.name)}</strong>
          <span> ${member.progress}% complete</span>
          <progress max="100" value="${member.progress}"></progress>
          <br>
          <input type="number" min="0" max="100" value="${member.progress}" onchange="updateMemberProgress(${index}, this.value)">
          <span>% complete</span>
          <br>
          <textarea id="work-${index}" placeholder="Describe the work completed">${escapeHtml(member.work)}</textarea>
          <button onclick="saveWorkUpdate(${index})">Save Work Update</button>
          <span class="${member.reviewed ? "reviewed" : ""}">${member.reviewed ? "Work reviewed" : "Waiting for review"}</span>
          <button onclick="toggleReview(${index})">${member.reviewed ? "Undo Review" : "Review Work"}</button>
          <button onclick="removeTeamMember(${index})">Remove Member</button>
        </div>
      `).join("");
    }

    function updateMemberProgress(index, value) {
      teamMembers[index].progress = Math.max(0, Math.min(100, Number(value) || 0));
      renderTeamStatus();
    }

    function addTeamMember() {
      const input = document.getElementById("newMemberName");
      const name = input.value.trim();
      if (!name) return;
      teamMembers.push({ name, progress: 0, work: "", reviewed: false });
      input.value = "";
      renderTeamStatus();
    }

    function saveWorkUpdate(index) {
      const work = document.getElementById("work-" + index);
      teamMembers[index].work = work.value.trim();
      teamMembers[index].reviewed = false;
      renderTeamStatus();
    }

    function updateTeamLeader() {
      const input = document.getElementById("teamLeaderName");
      const name = input.value.trim();
      if (!name) return;
      teamLeader = name;
      status();
    }

    function toggleReview(index) {
      teamMembers[index].reviewed = !teamMembers[index].reviewed;
      renderTeamStatus();
    }

    function removeTeamMember(index) {
      if (!confirm("Remove " + teamMembers[index].name + " from the team?")) return;
      teamMembers.splice(index, 1);
      renderTeamStatus();
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[character]));
    }

    function chat() {
      document.open();
      document.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>WebRTC Chat and File Transfer</title>
          <style>
            body { font-family: Arial, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 20px; }
            textarea, input { box-sizing: border-box; width: 100%; margin: 6px 0 12px; padding: 8px; }
            #messages { min-height: 180px; resize: vertical; }
            button { cursor: pointer; margin: 4px 4px 12px 0; padding: 8px 12px; }
            .row { display: flex; gap: 8px; }
            .row input { flex: 1; }
            .panel { border: 1px solid #ccc; padding: 14px; margin: 16px 0; }
            #connectionStatus { font-weight: bold; }
          </style>
        </head>
        <body>
          <h1>WebRTC Chat &amp; File Transfer</h1>
          <p id="connectionStatus">WebRTC link is ready</p>
          <button onclick="showDashboard()">Back</button>

          <textarea id="messages" rows="10" readonly></textarea>
          <div class="row">
            <input type="text" id="inputMsg" placeholder="Type a message">
            <button onclick="sendMessage()">Send</button>
          </div>

          <input type="file" id="fileInput">
          <button onclick="sendFile()">Send File</button>
        </body>
        </html>
      `);
      document.close();
      initialisePeerConnection();
    }

    function appendMessage(message) {
      const messages = document.getElementById("messages");
      if (messages) messages.value += message + "\n";
    }

    function setConnectionStatus(status) {
      const element = document.getElementById("connectionStatus");
      if (element) element.textContent = status;
    }

    function setupDataChannel(channel) {
      dataChannel = channel;
      dataChannel.onopen = () => setConnectionStatus("Connected");
      dataChannel.onclose = () => setConnectionStatus("Disconnected");
      dataChannel.onerror = () => setConnectionStatus("Connection error");
      dataChannel.onmessage = event => {
        appendMessage(event.data instanceof Blob ? "Peer sent a file." : "Peer: " + event.data);
      };
    }

    function initialisePeerConnection() {
      peerConnection = new RTCPeerConnection();
      dataChannel = peerConnection.createDataChannel("chat");
      setupDataChannel(dataChannel);
      peerConnection.ondatachannel = event => setupDataChannel(event.channel);
      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState !== "connected") {
          setConnectionStatus(peerConnection.connectionState);
        }
      };
    }

    function sendMessage() {
      const input = document.getElementById("inputMsg");
      const message = input.value.trim();
      if (!message) return;
      if (dataChannel && dataChannel.readyState === "open") dataChannel.send(message);
      appendMessage("You: " + message);
      input.value = "";
    }

    function sendFile() {
      const file = document.getElementById("fileInput").files[0];
      if (!file || !dataChannel || dataChannel.readyState !== "open") return;
      const reader = new FileReader();
      reader.onload = () => {
        dataChannel.send(reader.result);
        appendMessage("You sent file: " + file.name);
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
